<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">🎓 StudentMS</div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/register">Register</a>
                <a href="/login">Login</a>
            </div>
        </nav>
    </header>

    <main class="form-page">
        <div class="form-container wide">
            <h1>Student Registration</h1>
            <p class="form-subtitle">Enter your details to create a student account.</p>

            <div id="registerMessage" class="message"></div>

            <form id="registerForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter full name" required>
                    </div>

                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" name="age" min="1" max="100" placeholder="Enter age" required>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                    </div>

                    <div class="form-group">
                        <label for="mobile">Mobile Number</label>
                        <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
                    </div>

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" minlength="3" placeholder="Choose username" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" minlength="6" placeholder="Minimum 6 characters" required>
                    </div>

                    <div class="form-group">
                        <label for="course">Course</label>
                        <select id="course" name="course" required>
                            <option value="">Select course</option>
                            <option value="B.Tech - CSE">B.Tech - CSE</option>
                            <option value="B.Tech - ECE">B.Tech - ECE</option>
                            <option value="B.Tech - EEE">B.Tech - EEE</option>
                            <option value="B.Tech - IT">B.Tech - IT</option>
                            <option value="B.Tech - Mechanical">B.Tech - Mechanical</option>
                            <option value="B.Tech - Civil">B.Tech - Civil</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="address">Address</label>
                        <textarea id="address" name="address" rows="3" placeholder="Enter your address" required></textarea>
                    </div>
                </div>

                <button type="submit" class="btn primary full-button">Create Account</button>
            </form>

            <p class="bottom-text">
                Already registered? <a href="/login">Login here</a>
            </p>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
